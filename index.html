<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>REMS – Reefer Equipment Maintenance System</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    header { background: #003366; color: white; padding: 15px 20px; text-align: center; font-size: 20px; position: relative; }
    main { padding: 20px; max-width: 1200px; margin: auto; }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    label { font-weight: bold; margin-bottom: 5px; display: block; }
    input, select, textarea, button {
      padding: 8px;
      width: 100%;
      font-size: 14px;
      margin-bottom: 10px;
    }
    textarea { resize: vertical; }
    .full-width { grid-column: 1 / -1; }
    fieldset { border: 1px solid #ccc; padding: 10px; border-radius: 5px; position: relative; }
    legend { font-weight: bold; }
    button.add-button {
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button.add-button:hover { background-color: #0059b3; }
    @media (max-width: 768px) {
      form { grid-template-columns: 1fr; }
    }
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
    }
    #loginBox {
      background: white; padding: 20px; border-radius: 8px;
      max-width: 300px; width: 90%;
    }
    #loginBox input { width: 100%; margin-bottom: 10px; padding: 8px; }
    #loginError { color: red; display: none; font-size: 14px; }
    .job-section { margin-bottom: 15px; border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
    .remove-btn {
      position: absolute;
      right: 10px;
      top: 10px;
      background: #990000;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-btn:hover {
      background: #770000;
    }
    .photo-container {
      position: relative;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .photo-remove-btn {
      background: #990000;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .photo-remove-btn:hover {
      background: #770000;
    }
    .photo-input {
      flex-grow: 1;
    }
    .photo-section {
      margin-bottom: 15px;
    }
    .photo-section label {
      margin-bottom: 8px;
      display: block;
    }
    .alarm-input-container {
      position: relative;
      margin-bottom: 10px;
    }
    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
      opacity: 0.7;
    }
    #submitButton {
      transition: background-color 0.3s ease;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .invalid-temp {
      border: 1px solid red;
      background-color: #ffeeee;
    }
    .photo-preview {
      max-width: 100px;
      max-height: 100px;
      margin-top: 5px;
      display: none;
    }
    .compression-info {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .view-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .view-toolbar h2 { margin: 0; color: #003366; }
    .secondary-button { width: auto; margin: 0; padding: 9px 14px; border: 1px solid #003366; border-radius: 5px; background: white; color: #003366; cursor: pointer; }
    #repairListView { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,.1); }
    .table-wrap { overflow-x: auto; }
    .repair-table { width: 100%; border-collapse: collapse; min-width: 900px; }
    .repair-table th, .repair-table td { padding: 11px 10px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    .repair-table th { background: #003366; color: white; position: sticky; top: 0; }
    .container-link { color: #0059b3; font-weight: bold; border: 0; padding: 0; margin: 0; width: auto; background: none; cursor: pointer; text-decoration: underline; }
    .history-button { width: 28px; height: 28px; margin: 0; padding: 0; border: 1px solid #0059b3; border-radius: 50%; color: #0059b3; background: #eef6ff; cursor: pointer; font-weight: bold; line-height: 26px; text-align: center; }
    .list-message { padding: 28px; text-align: center; color: #666; }
    #reportView { display: none; }
    #historyModal { display:none; position:fixed; inset:0; z-index:9500; background:rgba(0,0,0,.62); padding:20px; overflow:auto; }
    .history-dialog { max-width:760px; margin:35px auto; background:white; border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.35); overflow:hidden; }
    .history-header { display:flex; justify-content:space-between; align-items:center; gap:15px; padding:16px 20px; background:#003366; color:white; }
    .history-header h2 { margin:0; font-size:19px; }
    .history-close { width:auto; margin:0; padding:2px 8px; border:0; background:transparent; color:white; font-size:28px; cursor:pointer; }
    #historyContent { padding:18px 20px; }
    .history-card { border:1px solid #d8d8d8; border-radius:7px; padding:15px; margin-bottom:14px; }
    .history-meta { font-weight:bold; color:#003366; margin-bottom:12px; }
    .history-card h4 { margin:13px 0 6px; color:#333; }
    .history-card p { margin:0; white-space:pre-wrap; }
    .history-jobs { margin:0; padding-left:20px; }
    #containerActionModal, #repairZoneModal { display:none; position:fixed; inset:0; z-index:9600; background:rgba(0,0,0,.62); padding:20px; overflow:auto; }
    .action-dialog { max-width:460px; margin:90px auto; background:white; border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.35); overflow:hidden; }
    .action-body { padding:22px; }
    .action-body p { margin:0 0 16px; }
    .action-buttons { display:grid; gap:10px; }
    .action-button { width:100%; margin:0; padding:12px 14px; border-radius:6px; cursor:pointer; font-weight:bold; }
    .report-action { border:1px solid #003366; background:#003366; color:white; }
    .zone-action { border:1px solid #b56700; background:#fff4e5; color:#8a4e00; }
    .cancel-action { border:1px solid #aaa; background:white; color:#444; }
    #repairZonePosition { width:100%; box-sizing:border-box; margin:6px 0 18px; padding:10px; border:1px solid #aaa; border-radius:5px; font-size:16px; text-transform:uppercase; }
    #repairZoneError { display:none; margin:0 0 14px; color:#b00020; }

    /* Editable Job / Part autocomplete */
    .autocomplete-wrap { position: relative; margin-bottom: 14px; }
    .autocomplete-wrap input.autocomplete-input {
      width: 100%; height: 38px; margin: 0; padding: 8px 10px;
      border: 1px solid #aaa; border-radius: 4px; background: #fff;
    }
    .autocomplete-results {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 2px);
      z-index: 5000; max-height: 260px; overflow-y: auto;
      background: #fff; border: 1px solid #aaa; border-radius: 4px;
      box-shadow: 0 5px 14px rgba(0,0,0,.14);
    }
    .autocomplete-results.open { display: block; }
    .autocomplete-item {
      padding: 9px 10px; cursor: pointer; border-bottom: 1px solid #eee;
      font-size: 14px; line-height: 1.3;
    }
    .autocomplete-item:last-child { border-bottom: 0; }
    .autocomplete-item:hover, .autocomplete-item.active { background: #eef6ff; }
    .autocomplete-empty { padding: 9px 10px; color: #666; font-size: 13px; }
    .job-section { overflow: visible; }


    /* Clean mobile photo picker */
    .photo-section .photo-container {
      display: block;
      margin: 12px 0 18px;
    }
    .photo-section .photo-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      background: #fff;
    }
    .photo-section .photo-input::file-selector-button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      margin-right: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .photo-selection-count {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

</style>
</head>
<body>
<header>
    <button onclick="logout()" style="float:right; margin-right:10px; background-color:#990000; color:white; border:none; padding:5px 10px; cursor:pointer;">
      Logout
    </button>REMS – Reefer Equipment Maintenance System</header>
<main>
<section id="repairListView">
  <div class="view-toolbar">
    <h2>Repair List</h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
      <button class="secondary-button" type="button" onclick="openManualReport()">New Report – Reefer Not on List</button>
      <button class="secondary-button" type="button" onclick="loadRepairList()">Refresh</button>
    </div>
  </div>
  <div id="repairListStatus" class="list-message">Loading repair list...</div>
  <div id="repairListTableWrap" class="table-wrap" hidden>
    <table class="repair-table">
      <thead><tr><th>Container</th><th>History</th><th>Order Temp</th><th>Position</th><th>Alarm(s)</th><th>ETD</th><th>Vessel</th><th>Requested Repair</th><th>Remarks</th></tr></thead>
      <tbody id="repairListBody"></tbody>
    </table>
  </div>
</section>
<section id="reportView">
<div class="view-toolbar">
  <h2>Repair Report</h2>
  <button class="secondary-button" type="button" onclick="showRepairList()">← Back to Repair List</button>
</div>
<form id="repairForm">
<label for="containernr">CONTAINERNR</label><input id="containernr" name="containernr" oninput="this.value = this.value.toUpperCase()" pattern="^[A-Z]{4}[0-9]{7}$" required="" title="Must be 4 letters followed by 7 digits (e.g., MSDU9823150)" type="text"/>
<label for="datum">DATUM (Date)</label><input id="datum" name="datum" required="" type="date">
<label for="naam">NAAM (Technician Name)</label><input id="naam" name="naam" readonly="" required="" type="text"/>
<label for="model">MODEL NR</label><input id="model" name="model" required="" type="text"/>
<label for="model_family">MODEL FAMILY</label>
<select id="model_family" name="model_family" required>
  <option value="">Select model family</option>
  <option value="PrimeLine">PrimeLine</option>
  <option value="OptimaLine">OptimaLine</option>
  <option value="StarCool">StarCool</option>
  <option value="ThinLINE">ThinLINE</option>
  <option value="EliteLINE">EliteLINE</option>
  <option value="NaturaLINE">NaturaLINE</option>
</select>
<label for="serienr">SERIENR.</label><input id="serienr" name="serienr" required="" type="text"/>
<label for="warranty_id">WARRANTY ID NR</label><input id="warranty_id" name="warranty_id" required="" type="text"/>
<label for="garantie">GARANTIE</label><input id="garantie" name="garantie" required="" type="text"/>
<label for="setpoint">SETPOINT °C</label><input id="setpoint" name="setpoint" required="" type="text" oninput="validateTemperatureInput(this)"/>
<label for="vents">VENTS</label><input id="vents" name="vents" required="" type="text"/>
<label for="hum">HUM</label><input id="hum" name="hum" required="" type="text"/>
<label for="ambient">AMBIENT °C</label><input id="ambient" name="ambient" required="" type="text" oninput="validateTemperatureInput(this)"/>
<label for="supply_voor">SUPPLY VOOR °C</label><input id="supply_voor" name="supply_voor" required="" type="text" oninput="validateTemperatureInput(this)"/>
<label for="supply_na">SUPPLY NA °C</label><input id="supply_na" name="supply_na" required="" type="text" oninput="validateTemperatureInput(this)"/>
<label for="return_voor">RETURN VOOR °C</label><input id="return_voor" name="return_voor" required="" type="text" oninput="validateTemperatureInput(this)"/>
<label for="return_na">RETURN NA °C</label><input id="return_na" name="return_na" required="" type="text" oninput="validateTemperatureInput(this)"/>
<label for="temp_in_range">TEMPERATUUR IN-RANGE NA REPAIR</label><input id="temp_in_range" name="temp_in_range" required="" type="text"/>
<label for="afmelding">AFMELDING</label>
<select id="afmelding" name="afmelding" required>
<option value="">Select</option>
<option value="Ja">Ja</option>
<option value="Nee">Nee</option>
</select>
<label class="full-width" for="probleem">OMSCHRIJVING / PROBLEEM</label><textarea class="full-width" id="probleem" name="probleem" required="" rows="3"></textarea>
<label class="full-width" for="opmerkingen">OPMERKINGEN</label><textarea class="full-width" id="opmerkingen" name="opmerkingen" required="" rows="3"></textarea>
<div class="full-width" id="photosSection">
<fieldset>
<legend>Photos</legend>
<div class="photo-section">
  <label>Fotos VOOR</label>
  <div id="fotos_voor">
    <div class="photo-container">
      <input class="photo-input" name="fotos_voor" required type="file" accept="image/*" onchange="handleImageUpload(this)" multiple>
      <img class="photo-preview">
      <div class="compression-info"></div>
    
    </div>
  </div>
</div>
<div class="photo-section">
  <label>Fotos NA</label>
  <div id="fotos_na">
    <div class="photo-container">
      <input class="photo-input" name="fotos_na" required type="file" accept="image/*" onchange="handleImageUpload(this)" multiple>
      <img class="photo-preview">
      <div class="compression-info"></div>
    
    </div>
  </div>
</div>
</fieldset>
</div>
<div class="full-width" id="alarmContainer">
<fieldset><legend>Alarms</legend></fieldset>
<button class="add-button" onclick="addAlarm()" type="button">Add Alarm</button>
</div>
<div class="full-width" id="jobContainer">
<fieldset><legend>Job Tasks</legend></fieldset>
<button class="add-button" onclick="addJob()" type="button">Add Job</button><button class="add-button" onclick="addUndefinedJob()" type="button">Add Undefined Job</button>
</div>
<button class="full-width" type="submit" id="submitButton">Submit Report</button>
</form>
</section>
</main>
<div id="historyModal" onclick="if(event.target === this) closeHistory()">
  <div class="history-dialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="history-header"><h2 id="historyTitle">Repair History</h2><button type="button" class="history-close" onclick="closeHistory()" aria-label="Close">×</button></div>
    <div id="historyContent">Loading history...</div>
  </div>
</div>
<div id="containerActionModal" onclick="if(event.target === this) closeContainerActions()">
  <div class="action-dialog" role="dialog" aria-modal="true" aria-labelledby="containerActionTitle">
    <div class="history-header"><h2 id="containerActionTitle">Choose Action</h2><button type="button" class="history-close" onclick="closeContainerActions()" aria-label="Close">×</button></div>
    <div class="action-body">
      <p id="containerActionText"></p>
      <div class="action-buttons">
        <button type="button" class="action-button report-action" onclick="continueToReport()">Create New Report</button>
        <button type="button" class="action-button zone-action" onclick="openRepairZoneForm()">Request Repair Zone</button>
        <button type="button" class="action-button cancel-action" onclick="closeContainerActions()">Cancel</button>
      </div>
    </div>
  </div>
</div>
<div id="repairZoneModal" onclick="if(event.target === this) closeRepairZoneForm()">
  <div class="action-dialog" role="dialog" aria-modal="true" aria-labelledby="repairZoneTitle">
    <div class="history-header"><h2 id="repairZoneTitle">Request Repair Zone</h2><button type="button" class="history-close" onclick="closeRepairZoneForm()" aria-label="Close">×</button></div>
    <form class="action-body" onsubmit="submitRepairZoneRequest(event)">
      <p id="repairZoneContainer"></p>
      <label for="repairZonePosition"><strong>Current Position</strong></label>
      <input id="repairZonePosition" autocomplete="off" required placeholder="Example: 2556/O" />
      <p id="repairZoneError"></p>
      <div class="action-buttons">
        <button id="repairZoneSubmit" type="submit" class="action-button zone-action">Send Request</button>
        <button type="button" class="action-button cancel-action" onclick="closeRepairZoneForm()">Cancel</button>
      </div>
    </form>
  </div>
</div>
<div id="loginOverlay">
<div id="loginBox">
<h3>Login</h3>
<input id="username" placeholder="Username" type="text"/>
<input id="password" placeholder="Password" type="password"/>
<div id="loginError">Invalid credentials</div>
<button onclick="validateLogin()">Login</button>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
let selectedContainerNumber = '';
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
}

async function loadRepairList() {
  const status = document.getElementById('repairListStatus');
  const wrap = document.getElementById('repairListTableWrap');
  status.hidden = false;
  status.textContent = 'Loading repair list...';
  wrap.hidden = true;
  try {
    const response = await fetch('/api/repair-list');
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || 'Could not load repair list');
    const body = document.getElementById('repairListBody');
    body.innerHTML = result.items.map(item => `<tr>
      <td><button type="button" class="container-link" data-container="${escapeHtml(item.container_number)}" onclick="openContainerActions(this.dataset.container)">${escapeHtml(item.container_number)}</button></td>
      <td>${item.history_count ? `<button type="button" class="history-button" data-container="${escapeHtml(item.container_number)}" onclick="openHistory(this.dataset.container)" title="View repair history" aria-label="View ${Number(item.history_count)} previous repair report${Number(item.history_count) === 1 ? '' : 's'}">${Number(item.history_count)}</button>` : ''}</td>
      <td>${escapeHtml(item.order_temp)}</td><td>${escapeHtml(item.position)}</td><td>${escapeHtml(item.alarms)}</td>
      <td>${escapeHtml(item.etd)}</td><td>${escapeHtml(item.vessel)}</td><td>${escapeHtml(item.requested_repair)}</td><td>${escapeHtml(item.remarks)}</td>
    </tr>`).join('');
    if (!result.items.length) {
      status.textContent = 'No reefers are currently waiting for repair.';
    } else {
      status.hidden = true;
      wrap.hidden = false;
    }
  } catch (error) {
    status.textContent = 'Could not load the repair list: ' + error.message;
  }
}

async function openHistory(containerNumber) {
  const modal = document.getElementById('historyModal');
  const content = document.getElementById('historyContent');
  document.getElementById('historyTitle').textContent = `Repair History – ${containerNumber}`;
  content.textContent = 'Loading history...';
  modal.style.display = 'block';
  try {
    const response = await fetch(`/api/report-history/${encodeURIComponent(containerNumber)}`);
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || 'Could not load history');
    content.innerHTML = result.history.map(report => {
      const alarms = report.alarms.length ? report.alarms.map(escapeHtml).join(', ') : 'None recorded';
      const jobs = report.jobs.length ? `<ul class="history-jobs">${report.jobs.map(job => {
        const part = job.part_number ? ` — Part: ${escapeHtml(job.part_number)}${job.quantity ? ` × ${Number(job.quantity)}` : ''}` : '';
        return `<li>${escapeHtml(job.job_code)} ${escapeHtml(job.description)}${part}${job.part_description ? ` (${escapeHtml(job.part_description)})` : ''}</li>`;
      }).join('')}</ul>` : '<p>No job details recorded.</p>';
      return `<article class="history-card">
        <div class="history-meta">${escapeHtml(report.report_date)} · ${escapeHtml(report.technician_name)}</div>
        <h4>Reported problem</h4><p>${escapeHtml(report.problem_description) || '—'}</p>
        <h4>Alarm(s)</h4><p>${alarms}</p>
        <h4>Work performed / parts used</h4>${jobs}
        <h4>Comments</h4><p>${escapeHtml(report.comments) || '—'}</p>
      </article>`;
    }).join('') || '<div class="list-message">No reports found in the last 30 days.</div>';
  } catch (error) {
    content.textContent = 'Could not load history: ' + error.message;
  }
}

function closeHistory() {
  document.getElementById('historyModal').style.display = 'none';
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeHistory();
    closeContainerActions();
    closeRepairZoneForm();
  }
});

function openContainerActions(containerNumber) {
  selectedContainerNumber = containerNumber;
  document.getElementById('containerActionText').textContent = `What do you want to do with ${containerNumber}?`;
  document.getElementById('containerActionModal').style.display = 'block';
}

function closeContainerActions() {
  document.getElementById('containerActionModal').style.display = 'none';
}

function continueToReport() {
  const containerNumber = selectedContainerNumber;
  closeContainerActions();
  openRepairReport(containerNumber);
}

function openRepairZoneForm() {
  closeContainerActions();
  document.getElementById('repairZoneContainer').innerHTML = `<strong>Container:</strong> ${escapeHtml(selectedContainerNumber)}`;
  document.getElementById('repairZonePosition').value = '';
  document.getElementById('repairZoneError').style.display = 'none';
  document.getElementById('repairZoneModal').style.display = 'block';
  setTimeout(() => document.getElementById('repairZonePosition').focus(), 0);
}

function closeRepairZoneForm() {
  document.getElementById('repairZoneModal').style.display = 'none';
}

async function submitRepairZoneRequest(event) {
  event.preventDefault();
  const position = document.getElementById('repairZonePosition').value.trim().toUpperCase();
  const technicianName = localStorage.getItem('loggedInUser') || document.getElementById('naam').value;
  const submitButton = document.getElementById('repairZoneSubmit');
  const errorText = document.getElementById('repairZoneError');
  errorText.style.display = 'none';
  submitButton.disabled = true;
  submitButton.textContent = 'Sending...';

  try {
    const response = await fetch('/api/request-repair-zone', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        container_number: selectedContainerNumber,
        technician_name: technicianName,
        current_position: position
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || 'Could not send the request');
    closeRepairZoneForm();
    alert(`✅ Repair-zone request sent for ${selectedContainerNumber}`);
  } catch (error) {
    errorText.textContent = error.message;
    errorText.style.display = 'block';
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Send Request';
  }
}

function prepareReport(containerNumber = '') {

function validateTemperatureInput(input) {
  // Remove any characters that aren't numbers, minus sign, or dot
  input.value = input.value.replace(/[^0-9\-.]/g, '');
  
  // Validate the format (only one minus sign at start, only one decimal point)
  const value = input.value;
  let isValid = true;
  
  // Check for multiple minus signs or minus in wrong position
  if ((value.match(/-/g) || []).length > 1 || (value.indexOf('-') > 0)) {
    isValid = false;
  }
  
  // Check for multiple decimal points
  if ((value.match(/\./g) || []).length > 1) {
    isValid = false;
  }
  
  // Highlight invalid inputs
  if (!isValid || (value && !/^-?\d*\.?\d*$/.test(value))) {
    input.classList.add('invalid-temp');
  } else {
    input.classList.remove('invalid-temp');
  }
  
  return isValid;
}

function updateSerialRequirements(fieldset) {
  const partDescription =
    fieldset.querySelector('input[name="part_description[]"]')?.value?.trim().toLowerCase() || '';

  // SNs mandatory only for these component groups.
  const serialRequired =
    /humidity/.test(partDescription) ||
    /\bo2\b|o²|oxygen/.test(partDescription) ||
    /\bco2\b|co²|carbon dioxide/.test(partDescription) ||
    (
      /(evaporator|condenser)/.test(partDescription) &&
      /(fan|motor)/.test(partDescription)
    ) ||
    /(condenser.*coil|coil.*condenser)/.test(partDescription);

  const oldSerial = fieldset.querySelector('input[name="serial_old[]"]');
  const newSerial = fieldset.querySelector('input[name="serial_new[]"]');
  const oldLabel = oldSerial?.previousElementSibling;
  const newLabel = newSerial?.previousElementSibling;

  if (oldSerial) oldSerial.required = serialRequired;
  if (newSerial) newSerial.required = serialRequired;

  if (oldLabel) {
    oldLabel.innerHTML = serialRequired
      ? 'Old Serial Number <span style="color:#b00020">*</span>'
      : 'Old Serial Number <span style="font-weight:normal;color:#666">(optional)</span>';
  }
  if (newLabel) {
    newLabel.innerHTML = serialRequired
      ? 'New Serial Number <span style="color:#b00020">*</span>'
      : 'New Serial Number <span style="font-weight:normal;color:#666">(optional)</span>';
  }
}

  const jobCode = fieldset.querySelector('input[name="job_code[]"]')?.value?.trim().toUpperCase() || '';

  const standardPart = fieldset.querySelector('.standard-job-fields');

  if (standardDetails) standardDetails.style.display = isRefrigerant ? 'none' : '';
  if (bottleField) bottleField.style.display = isRefrigerant ? '' : 'none';

  if (isRefrigerant) {

    const oldSerial = fieldset.querySelector('input[name="serial_old[]"]');
    const newSerial = fieldset.querySelector('input[name="serial_new[]"]');

function setupAutocomplete(fieldset, selector, url, onSelect, onClear) {
  const input = fieldset.querySelector(selector);
  const results = input.parentElement.querySelector('.autocomplete-results');
  let timer = null;
  let requestId = 0;

  const close = () => {
    results.classList.remove('open');
    results.innerHTML = '';
  };

  input.addEventListener('input', () => {
    // Once the technician edits selected text, the previous selection is no longer valid.
    onClear();
    const q = input.value.trim();
    clearTimeout(timer);

    if (!q) {
      close();
      return;
    }

    timer = setTimeout(async () => {
      const thisRequest = ++requestId;
      try {
        const response = await fetch(`${url}?q=${encodeURIComponent(q)}`);
        const payload = await response.json();
        if (thisRequest !== requestId) return;

        const items = Array.isArray(payload) ? payload : (payload.results || []);
        results.innerHTML = '';

        if (!items.length) {
          results.innerHTML = '<div class="autocomplete-empty">No matching results</div>';
          results.classList.add('open');
          return;
        }

        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'autocomplete-item';
          row.textContent = item.text || item.description || item.id || '';
          row.addEventListener('mousedown', event => {
            event.preventDefault();
            input.value = item.text || item.description || item.id || '';
            close();
            onSelect(item);
          });
          results.appendChild(row);
        });
        results.classList.add('open');
      } catch (err) {
        close();
      }
    }, 180);
  });

  input.addEventListener('focus', () => {
    if (input.value.trim()) input.dispatchEvent(new Event('input'));
  });

  input.addEventListener('keydown', event => {
    if ((event.key === 'Backspace' || event.key === 'Delete') && input.value === '') {
      onClear();
      close();
    }
    if (event.key === 'Escape') close();
  });

  input.addEventListener('blur', () => setTimeout(close, 120));
}

async function recalculateLabor(fieldset) {
  const jobCode = fieldset.querySelector('input[name="job_code[]"]')?.value?.trim().toUpperCase() || '';
  if (jobCode === 'E001II') {
    const laborInput = fieldset.querySelector('input[name="labor_hours[]"]');
    const laborNote = fieldset.querySelector('.labor-note');
    if (laborInput) {
      laborInput.value = '0.5';
      laborInput.readOnly = true;
    }
    if (laborNote) laborNote.textContent = 'Fixed labor: 0.5 h';
    return;
  }

  const model = document.getElementById('model_family')?.value?.trim() || '';
  const partNumber = fieldset.querySelector('input[name="part_number[]"]')?.value?.trim() || '';
  const repairCode = fieldset.querySelector('input[name="repair_type[]"]')?.value?.trim() || '';
  const quantity = fieldset.querySelector('input[name="quantity[]"]')?.value || '1';
  const laborInput = fieldset.querySelector('input[name="labor_hours[]"]');
  const laborNote = fieldset.querySelector('.labor-note');
  const quantityNote = fieldset.querySelector('.quantity-note');

  if (!laborInput) return;

  if (!model) {
    laborInput.value = '0';
    if (laborNote) laborNote.textContent = 'Select Model Family above to calculate Labor Hours.';
    return;
  }
  if (!partNumber) {
    laborInput.value = '0';
    if (laborNote) laborNote.textContent = 'Select a Used Part to calculate Labor Hours.';
    return;
  }

  if (laborNote) laborNote.textContent = 'Calculating Labor Hours...';

  try {
    const params = new URLSearchParams({
      model,
      part_number: partNumber,
      repair_code: repairCode,
      quantity
    });
    const response = await fetch('/api/labor-hours?' + params.toString());
    const data = await response.json();

    if (data.status === 'success') {
      laborInput.value = Number(data.labor_hours || 0).toFixed(2).replace(/\.00$/, '');
      if (laborNote) laborNote.textContent =
        `Auto: ${data.first_hour} h × ${quantity} = ${data.labor_hours} h (${data.model_family})`;
      if (quantityNote) quantityNote.textContent = data.is_cable ? '— 1 roll = 18 m' : '';
    } else {
      laborInput.value = '0';
      if (laborNote) laborNote.textContent =
        `No matching labor rule found for ${partNumber} (${model}). Enter Labor Hours manually.`;
      if (quantityNote) quantityNote.textContent = '';
    }
  } catch (err) {
    if (laborNote) laborNote.textContent =
      'Automatic labor lookup unavailable — enter Labor Hours manually.';
  }
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(event) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      
      // Calculate new dimensions while maintaining aspect ratio
      if (width > height) {
        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
      } else {
        if (height > MAX_HEIGHT) {
          width *= MAX_HEIGHT / height;
          height = MAX_HEIGHT;
        }
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      // Convert to compressed JPEG
      canvas.toBlob(function(blob) {
        const compressedFile = new File([blob], file.name, {
          type: 'image/jpeg',
          lastModified: Date.now()
        });
        callback(compressedFile, file.size);
      }, 'image/jpeg', QUALITY);
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' bytes';
  else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  else return (bytes / 1048576).toFixed(1) + ' MB';
}

async function submitRepair(event) {
  event.preventDefault();
  
  const submitButton = document.getElementById('submitButton');
  
  // Disable button and show loading state
  submitButton.disabled = true;
  submitButton.innerHTML = '<span class="spinner"></span> Processing...';

  try {
    // Require 2–10 actual files BEFORE and 2–10 actual files AFTER.
    const beforeInputs = Array.from(document.querySelectorAll('#fotos_voor input[type="file"]'));
    const afterInputs = Array.from(document.querySelectorAll('#fotos_na input[type="file"]'));
    const beforeCount = beforeInputs.reduce((sum, input) => sum + (input.files ? input.files.length : 0), 0);
    const afterCount = afterInputs.reduce((sum, input) => sum + (input.files ? input.files.length : 0), 0);

    if (beforeCount < 2 || beforeCount > 10) {
      alert("Please select minimum 2 and maximum 10 Before photos");
      throw new Error("Invalid before photo count");
    }
    if (afterCount < 2 || afterCount > 10) {
      alert("Please select minimum 2 and maximum 10 After photos");
      throw new Error("Invalid after photo count");
    }

    // Validate temperature inputs
    const tempInputs = [
      document.getElementById('setpoint'),
      document.getElementById('ambient'),
      document.getElementById('supply_voor'),
      document.getElementById('supply_na'),
      document.getElementById('return_voor'),
      document.getElementById('return_na')
    ];
    
    let hasInvalidTemp = false;
    tempInputs.forEach(input => {
      if (!validateTemperatureInput(input)) {
        hasInvalidTemp = true;
      }
    });
    
    if (hasInvalidTemp) {
      alert("Please correct the invalid temperature values (only numbers, minus sign, and one decimal point allowed)");
      throw new Error("Invalid temperature values");
    }

    const form = document.getElementById("repairForm");
    const formData = new FormData(form);

    formData.append("containernr", form.containernr.value);
    formData.append("naam", form.naam.value);
    formData.append("datum", form.datum.value);
    formData.append("model", form.model.value);
    formData.append("serienr", form.serienr.value);
    formData.append("warranty_id", form.warranty_id.value);
    formData.append("garantie", form.garantie.value);
    formData.append("setpoint", form.setpoint.value);
    formData.append("vents", form.vents.value);

    jobSections.forEach((section, index) => {

    });

    const response = await fetch('/api/submit', {
      method: "POST",
      body: formData,
    });

    const result = await response.json();
    if (result.status === "success") {
      alert("✅ Report submitted successfully!");
      const techName = document.getElementById("naam").value;
      form.reset();
      document.getElementById("naam").value = techName;
      // Reset to one job section
      document.querySelector("#jobContainer fieldset").innerHTML = "";
      addJob();
      showRepairList();
    } else {
      alert("❌ Error submitting report: " + result.message);
    }
  } catch (error) {
    if (error.message !== "Invalid before photo count" && error.message !== "Invalid after photo count" && error.message !== "Invalid temperature values") {
      alert("❌ Network error: " + error.message);
    }
  } finally {
    // Re-enable button regardless of success/error
    const submitButton = document.getElementById('submitButton');
    submitButton.disabled = false;
    submitButton.innerHTML = 'Submit Report';
  }
}

// Initialize form submission handler
document.getElementById("repairForm").addEventListener("submit", function(e) {
  // Prevent multiple submissions if button is already disabled
  if (document.getElementById('submitButton').disabled) {
    e.preventDefault();
    return;
  }
  submitRepair(e);
});
</script>
</body>
